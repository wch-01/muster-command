services:
  bot:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      APPLICATION_ID: ${APPLICATION_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      ADMIN_DISCORD_USER_IDS: ${ADMIN_DISCORD_USER_IDS:-}
      STATE: ${STATE:-production}
      DATABASE_URL: postgresql://bot:bot_password@postgres:5432/starbot?schema=public
      BOT_TIMEZONE: ${BOT_TIMEZONE:-UTC}
      SETUP_HOST: 0.0.0.0
      SETUP_PORT: 3000
      SETTINGS_FILE: /app/data/settings.json
      ADMIN_ALLOWED_HOSTS: ${ADMIN_ALLOWED_HOSTS:-localhost,127.0.0.1,::1}
    ports:
      - "3000:3000"
    volumes:
      - settings-data:/app/data
    command: sh -c "npx prisma db push --accept-data-loss && node dist/index.js"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: starbot
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d starbot"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  settings-data:
