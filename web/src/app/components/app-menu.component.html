<header class="top-menu">
  <a class="brand" href="/app/dashboard">Muster Command</a>
  <span class="env-badge" *ngIf="state === 'development'">Dev</span>
  <nav aria-label="Primary navigation">
    <a [class.active]="active === 'dashboard'" href="/app/dashboard">Dashboard</a>
    <div class="menu-group" [class.active]="eventActive">
      <button type="button">Events</button>
      <div class="menu-dropdown">
        <a [class.active]="active === 'active-events'" href="/app/active-events">Active Events</a>
        <a [class.active]="active === 'create-event'" href="/app/events">Create Event</a>
        <a [class.active]="active === 'past-events'" href="/app/past-events">Past Events</a>
      </div>
    </div>
    <a [class.active]="active === 'commands'" href="/slash-commands">Bot Commands</a>
    <a [class.active]="active === 'templates'" href="/app/templates">Templates</a>
    <a [class.active]="active === 'admin'" href="/admin">Admin</a>
    <a *ngIf="isSuperAdmin" [class.active]="active === 'system-admin'" href="/system-admin">System Admin</a>
  </nav>
  <div class="user-menu">
    <div class="server-select">
      <label for="activeGuildId">Active Server</label>
      <select
        id="activeGuildId"
        name="guildId"
        [value]="selectedGuildId"
        (change)="changeActiveServer($event)"
      >
        <option *ngIf="!servers.length" value="" disabled>No shared server</option>
        <option *ngIf="activeServer" [value]="activeServer.id" selected>{{ activeServer.name }}</option>
        <option *ngFor="let server of otherServers" [value]="server.id">{{ server.name }}</option>
        <option value="" disabled>--------</option>
        <option value="__invite">+ Add bot to another server</option>
      </select>
    </div>
    <span *ngIf="userName">{{ userName }}</span>
    <a href="/logout">Log out</a>
  </div>
</header>
