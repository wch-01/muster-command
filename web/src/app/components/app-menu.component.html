<header class="top-menu">
  <a class="brand" href="/app/dashboard" aria-label="Muster Command dashboard">
    <img
      class="brand-logo"
      src="assets/branding/muster-command-logo.svg"
      alt="Muster Command"
    />
  </a>
  <span class="env-badge" *ngIf="state === 'development'">Dev</span>
  <nav aria-label="Primary navigation">
    <a [class.active]="active === 'dashboard'" href="/app/dashboard">Dashboard</a>
    <a [class.active]="eventActive" href="/app/active-events">Events</a>
    <a [class.active]="active === 'commands'" href="/app/bot-commands">Bot Commands</a>
    <a [class.active]="active === 'templates'" href="/app/templates">Templates</a>
    <a [class.active]="active === 'admin'" href="/app/admin">Admin</a>
    <a *ngIf="isSuperAdmin" [class.active]="active === 'system-admin'" href="/app/system-admin">System Admin</a>
  </nav>
  <div class="user-menu">
    <div class="server-select">
      <label for="activeGuildId">Active Server</label>
      <select
        id="activeGuildId"
        name="guildId"
        [value]="selectedGuildId"
        (change)="changeActiveServer($event)"
      >
        <option *ngIf="!servers.length" value="" disabled>No shared server</option>
        <option *ngIf="activeServer" [value]="activeServer.id" selected>{{ activeServer.name }}</option>
        <option *ngFor="let server of otherServers" [value]="server.id">{{ server.name }}</option>
        <option value="" disabled>--------</option>
        <option value="__invite">+ Add bot to another server</option>
      </select>
    </div>
    <span *ngIf="userName">{{ userName }}</span>
    <button class="theme-toggle" type="button" (click)="toggleTheme()"
      [attr.aria-label]="isDarkMode ? 'Use light mode' : 'Use dark mode'"
      [attr.title]="isDarkMode ? 'Use light mode' : 'Use dark mode'">
      <span aria-hidden="true">{{ isDarkMode ? "☀" : "☾" }}</span>
    </button>
    <a href="/logout">Log out</a>
  </div>
</header>
